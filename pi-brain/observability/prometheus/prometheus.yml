global:
  scrape_interval: 5s
  evaluation_interval: 5s

# pi-brain pushes OTLP metrics DIRECTLY into Prometheus via its native OTLP
# receiver (--web.enable-otlp-receiver → POST /api/v1/otlp/v1/metrics). No scrape
# target for pi-brain is needed — it's push, not pull. We keep OTLP resource
# attributes as labels so verb/scope/etc. survive ingestion.
otlp:
  promote_all_resource_attributes: true

scrape_configs:
  # Prometheus self-monitoring (sanity check the stack is up).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
