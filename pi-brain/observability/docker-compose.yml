services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: pibrain-otel-collector
    restart: unless-stopped
    ports:
      - "4318:4318"   # OTLP/HTTP (pi-brain pushes metrics + traces here)
      - "4317:4317"   # OTLP/gRPC
      - "8889:8889"   # Prometheus scrape (collector re-exports metrics)
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol-contrib/config.yaml:ro

  prometheus:
    image: prom/prometheus:latest
    container_name: pibrain-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    extra_hosts:
      # Let the container reach pi-brain's Prometheus endpoint on the host.
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:latest
    container_name: pibrain-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Local-only dev stack: anonymous access as Admin, no login wall.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
