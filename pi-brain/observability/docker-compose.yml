services:
  prometheus:
    image: prom/prometheus:latest
    container_name: pibrain-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
      # Native OTLP push ingestion: pi-brain pushes OTLP metrics straight here
      # (POST /api/v1/otlp/v1/metrics). No collector needed.
      - "--web.enable-otlp-receiver"

  grafana:
    image: grafana/grafana:latest
    container_name: pibrain-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Local-only dev stack: anonymous access as Admin, no login wall.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
