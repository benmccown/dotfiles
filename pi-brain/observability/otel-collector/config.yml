receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  # Expose received metrics for Prometheus to scrape.
  prometheus:
    endpoint: 0.0.0.0:8889
    # Keep pi-brain's dotted metric names (pibrain.verb.*) legible.
    resource_to_telemetry_conversion:
      enabled: true

processors:
  batch: {}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
