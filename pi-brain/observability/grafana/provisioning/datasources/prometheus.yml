apiVersion: 1

# Remove any previously-provisioned "Prometheus" datasource first, so changing its
# uid below can't collide with a stale DB row (Grafana crash-loops with
# "Datasource provisioning error: data source not found" otherwise).
deleteDatasources:
  - name: Prometheus

datasources:
  - name: Prometheus
    type: prometheus
    uid: pibrain-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
